http:
  address: 0.0.0.0:3000
  session_ttl: 720h
users: []
language: "en"
theme: "auto"
dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  ratelimit: 20
filtering:
  protection_enabled: true
  filtering_enabled: true
  blocked_response_ttl: 10
  filters_update_interval: 24
  safebrowsing_enabled: false
  parental_enabled: false
  safe_search:
    enabled: false
filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
querylog:
  enabled: true
  file_enabled: true
  interval: 8760h
  size_memory: 1000
tls:
  enabled: false
statistics:
  enabled: true
  interval: 8760h
log:
  enabled: true
  file: ""
  max_backups: 0
  max_size: 100
  max_age: 3
  compress: false
  local_time: false
  verbose: false
schema_version: 34
