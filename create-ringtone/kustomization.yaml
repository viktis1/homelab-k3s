apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: create-ringtone

resources:
- resources/create-ringtone.namespace.yaml
- resources/create-ringtone-rustfs.pv.yaml
- resources/ringtone-worker-auth.secret.yaml

- components/object-storage
- components/cloud-ingest
- components/orchestrator
- components/gcp-queue
- components/relational-database


images:
- name: rustfs
  newTag: 1.0.0

- name: postgres-image
  newName: postgres
  newTag: "18.6"

- name: cloud-ingest-image
  newName: ghcr.io/viktis1/create-ringtone-cloud-ingest
  newTag: "71b9eaa7574804c1dbc3c3558f1cac683c89d9f0"

- name: create-ringtone-orchestrator-image
  newName: ghcr.io/viktis1/create-ringtone-orchestrator
  newTag: "71b9eaa7574804c1dbc3c3558f1cac683c89d9f0"

- name: create-ringtone-pubsub-watcher-image
  newName: ghcr.io/viktis1/create-ringtone-pubsub-watcher
  newTag: "657934e27e86025061d5bbddc57f0e828a001f3b"