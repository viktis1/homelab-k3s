# Persistent storage volume for the Rustfs database
apiVersion: v1
kind: PersistentVolume

metadata:
  name: create-ringtone-rustfs
spec:
  capacity:
    storage: 10000Mi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/create-ringtone/rustfs/k3smnt
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k3sagent02