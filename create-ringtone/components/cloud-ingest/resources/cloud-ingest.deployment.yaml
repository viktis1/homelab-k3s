apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-ingest

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-ingest
    spec:
      containers:
        - name: cloud-ingest
          image: cloud-ingest-image
          env:
            - name: GCP_PROJECT_ID
              value: ringtone-k8s
            - name: PUBSUB_SUBSCRIPTION
              value: voice-upload-ingest
            - name: RUSTFS_BUCKET
              value: voice-upload
            - name: RUSTFS_ENDPOINT
              value: http://rustfs:9000
            # Access keys
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs
                  key: secret-key
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/gcp/gcp-ingest-secret.json
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          volumeMounts:
            - name: gcp-credentials
              readOnly: true
              mountPath: /var/run/gcp/gcp-ingest-secret.json
              subPath: gcp-ingest-secret.json
      volumes:
        - name: gcp-credentials
          secret:
            secretName: gcp-sa-credentials
            items:
              - key: gcp-ingest-secret.json
                path: gcp-ingest-secret.json