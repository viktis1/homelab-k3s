<!DOCTYPE html>
<html>
<body>

<h1>Create Ringtone</h1>

<form id="form">
    <label>Receiver</label><br>
    <input name="receiver" required><br><br>

    <label>Caller</label><br>
    <input name="caller" required><br><br>

    <label>Voice</label><br>
    <select name="voice_id" id="voice" required>
        <option value="">Loading voices...</option>
    </select><br><br>

    <label>Voice clip</label><br>
    <select name="clip_id" id="clip" required disabled>
        <option value="">Choose a voice first</option>
    </select><br><br>
    
    <audio id="preview" controls hidden></audio><br><br>

    <button type="submit">Create ringtone</button>
</form>

<pre id="status"></pre>
<div id="result"></div>

<script>
const form = document.getElementById("form");
const status = document.getElementById("status");
const result = document.getElementById("result");
const voice = document.getElementById("voice");
const clip = document.getElementById("clip");
const preview = document.getElementById("preview");


let voices = [];

async function loadVoices() {
    const response = await fetch("/voices");
    const data = await response.json();

    voices = data.voices;

    voice.innerHTML = '<option value="">Choose a voice</option>';

    for (const item of voices) {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.name;
        voice.appendChild(option);
    }
}

voice.onchange = () => {
    preview.pause();
    preview.removeAttribute("src");
    preview.load();
    preview.hidden = true;

    const selectedVoice = voices.find(
        item => item.id === voice.value
    );

    clip.innerHTML = '<option value="">Choose a clip</option>';

    if (!selectedVoice) {
        clip.disabled = true;
        return;
    }

    for (const item of selectedVoice.clips) {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.name;
        clip.appendChild(option);
    }

    clip.disabled = false;
};

clip.onchange = () => {
    preview.pause();
    preview.removeAttribute("src");
    preview.load();

    if (!voice.value || !clip.value) {
        preview.hidden = true;
        return;
    }

    const params = new URLSearchParams({
        voice_id: voice.value,
        clip_id: clip.value,
    });

    preview.src = `/voice-preview?${params}`;
    preview.hidden = false;
};

loadVoices();

form.onsubmit = async event => {
    event.preventDefault();

    status.textContent = "Submitting...";
    result.innerHTML = "";

    const response = await fetch("/generate", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
    });

    const job = await response.json();

    if (!response.ok) {
        status.textContent = JSON.stringify(job);
        return;
    }

    status.textContent = `Job ${job.job_id}: ${job.status}`;
    trackJob(job);
};

function trackJob(job) {
    const timer = setInterval(async () => {
        const response = await fetch(job.status_url);
        const current = await response.json();

        status.textContent = `Job ${job.job_id}: ${current.status}`;

        if (current.status === "done") {
            clearInterval(timer);
            result.innerHTML = `<a href="${job.download_url}">Download ringtone</a>`;
        }

        if (current.status === "failed") {
            clearInterval(timer);
            status.textContent += `\n${current.error}`;
        }
    }, 2000);
}
</script>

</body>
</html>
