apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ringtone-postgres
spec:
  serviceName: ringtone-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ringtone-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ringtone-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres-image
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ringtone
            - name: POSTGRES_USER
              value: ringtone
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ringtone-postgres
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
